<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>สถานะระบบ KohKae</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/status_page.css">
</head>
<body>
<div class="wrap">
  <header>
    <div><div class="brand">KohKae Camera Plate</div><h1>สถานะระบบ</h1></div>
    <div class="right">
      <div id="overall" class="pill s-unknown"><span class="dot"></span><span id="overallText">กำลังเช็ค…</span></div>
      <div class="upd mono">อัปเดต <span id="upd">--:--:--</span><br>สด · เช็คทุก 1 วินาที</div>
    </div>
  </header>
  <div id="stale" class="stale">ติดต่อตัวเช็คสถานะไม่ได้ — ข้อมูลบนหน้านี้อาจไม่ใช่ล่าสุด</div>
  <section id="grid" class="grid" aria-live="polite"></section>
  <section class="panel">
    <div class="ph">
      <h2>เหตุการณ์ล่าสุด</h2>
      <div class="btns">
        <a class="btn ghost" href="/log" target="_blank" rel="noopener">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h6"/></svg>
          เปิด log</a>
        <a class="btn primary" id="mainLink" href="#" target="_blank" rel="noopener">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
          เปิดหน้าระบบหลัก</a>
      </div>
    </div>
    <div id="events"></div>
  </section>
</div>
<script>
const LABEL = { ok: "ปกติ", warn: "มีปัญหา", down: "ล่ม", unknown: "ไม่ทราบ" };
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const pill = (st, text, small) => { const p = el("div", "pill " + (small ? "sm " : "") + "s-" + st); p.append(el("span", "dot"), el("span", null, text)); return p; };
document.getElementById("mainLink").href = location.protocol + "//" + location.hostname + ":5173";
const thDay = (iso) => { const d = new Date(iso); return d.toLocaleDateString("th-TH", { day: "numeric", month: "short", timeZone: "Asia/Bangkok" }); };
let lastMsg = Date.now();
function render(s) {
  lastMsg = Date.now();
  document.getElementById("stale").style.display = "none";
  const o = document.getElementById("overall");
  o.className = "pill s-" + s.overall.st;
  document.getElementById("overallText").textContent = s.overall.text;
  document.getElementById("upd").textContent = s.updatedTh || "--:--:--";
  document.title = (s.overall.st === "ok" ? "🟢" : s.overall.st === "warn" ? "🟡" : "🔴").replace(/./u, "") + "สถานะระบบ KohKae";
  const g = document.getElementById("grid"); g.replaceChildren();
  for (const it of s.items) {
    const c = el("div", "card " + it.st);
    const top = el("div", "top"); const left = el("div");
    left.append(el("div", "name", it.name), el("div", "sub mono", it.sub));
    top.append(left, pill(it.st, LABEL[it.st] || it.st, true));
    c.append(top, el("div", "detail", it.detail));
    g.append(c);
  }
  const ev = document.getElementById("events"); ev.replaceChildren();
  if (!s.events.length) ev.append(el("div", "empty", "ยังไม่มีเหตุการณ์"));
  for (const e of s.events.slice(0, 12)) {
    const row = el("div", "ev s-" + e.st);
    row.append(el("span", "t mono", thDay(e.at) + " " + e.time), el("span", "dot"), el("span", null, e.text));
    ev.append(row);
  }
}
// รับสถานะสดจาก server (SSE) · ต่อใหม่เองถ้าหลุด · เบราว์เซอร์ไม่รองรับ → ถามทุก 2 วิแทน
if (window.EventSource) {
  const es = new EventSource("/api/stream");
  es.onmessage = (e) => { try { render(JSON.parse(e.data)); } catch (_) {} };
} else {
  const poll = async () => { try { render(await (await fetch("/api/status", { cache: "no-store" })).json()); } catch (_) {} };
  poll(); setInterval(poll, 2000);
}
// ไม่ได้ข้อมูลใหม่เกิน 5 วิ = ติดต่อตัวเช็คไม่ได้
setInterval(() => { if (Date.now() - lastMsg > 5000) document.getElementById("stale").style.display = "block"; }, 1000);
</script>
</body>
</html>
